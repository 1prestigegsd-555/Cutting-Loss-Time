function render() {
  const root = document.getElementById('app')

  // Lock screen if not unlocked
  if (!state.unlocked) {
    root.innerHTML = renderLock()
    const input = document.getElementById('lock-pwd')
    const errEl = document.getElementById('lock-err')
    const submit = async () => {
      const pwd = input.value
      if (!pwd) return
      const hash = await sha256Hex(pwd)
      if (hash === PASSWORD_HASH) {
        if (document.getElementById('lock-remember').checked) {
          localStorage.setItem(LS_UNLOCKED, '1')
        }
        state.unlocked = true
        if (initSupabase()) loadAll()
        else render()
      } else {
        errEl.textContent = 'Incorrect password.'
        errEl.classList.remove('hide')
        input.value = ''
        input.focus()
      }
    }
    document.getElementById('lock-submit').onclick = submit
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit() })
    input.focus()
    return
  }

  if (state.loading) {
    root.innerHTML = `<div class="muted">Loading…</div>`
    return
  }

  const ws = state.workspace
  const view = state.view
  const fView = state.fView
  const tabLabel = state.activeSession ? '● Active session' : 'Start session'
  const fTabLabel = state.fActiveSession ? '● Active bundle' : 'Start bundle'

  const headerTitle = ws === 'fusing' ? 'Fusing tracker' : 'Cutting downtime tracker'
  const headerSub = ws === 'fusing'
    ? 'Bundle tracking · panel cycles · 4M categorisation'
    : 'Per-session logging · 4M categorisation · Pareto analysis'

  root.innerHTML = `
    <div class="flex between" style="margin-bottom: 0.75rem; flex-wrap:wrap; gap:12px;">
      <div>
        <h1>${headerTitle}</h1>
        <div class="sub">${headerSub}</div>
      </div>
      <button class="btn-ghost" id="btn-settings" title="Sign out on this device">⇥ Sign out</button>
    </div>

    <div class="tabs" style="margin-bottom: 0.75rem;">
      <button class="tab ${ws === 'cutting' ? 'active' : ''}" data-workspace="cutting" style="font-weight: 500;">Cutting</button>
      <button class="tab ${ws === 'fusing' ? 'active' : ''}" data-workspace="fusing" style="font-weight: 500;">Fusing</button>
    </div>

    ${state.err ? `<div class="error" id="err-box">${esc(state.err)} <span class="muted" style="margin-left:8px;">(click to dismiss)</span></div>` : ''}

    ${ws === 'cutting' ? `
      <div class="tabs">
        <button class="tab ${view === 'list' || view === 'active' ? 'active' : ''}" data-tab="${state.activeSession ? 'active' : 'list'}">${tabLabel}</button>
        <button class="tab ${view === 'history' || view === 'detail' ? 'active' : ''}" data-tab="history">History</button>
        <button class="tab ${view === 'insights' ? 'active' : ''}" data-tab="insights">Insights</button>
        <button class="tab ${view === 'reasons' ? 'active' : ''}" data-tab="reasons">Reasons</button>
      </div>
      <div id="main-view">
        ${view === 'list' ? renderStartForm() : ''}
        ${view === 'active' ? renderActive() : ''}
        ${view === 'history' ? renderHistory() : ''}
        ${view === 'detail' ? renderDetail() : ''}
        ${view === 'insights' ? renderInsights() : ''}
        ${view === 'reasons' ? renderReasonsView() : ''}
      </div>
    ` : `
      <div class="tabs">
        <button class="tab ${fView === 'list' || fView === 'active' ? 'active' : ''}" data-f-tab="${state.fActiveSession ? 'active' : 'list'}">${fTabLabel}</button>
        <button class="tab ${fView === 'history' ? 'active' : ''}" data-f-tab="history">History</button>
        <button class="tab ${fView === 'reasons' ? 'active' : ''}" data-f-tab="reasons">Reasons</button>
      </div>
      <div id="main-view">
        ${fView === 'list' ? fRenderStartForm() : ''}
        ${fView === 'active' && state.fActiveSession ? fRenderActive() : ''}
        ${fView === 'history' ? fRenderHistory() : ''}
        ${fView === 'reasons' ? fRenderReasonsView() : ''}
      </div>
    `}
  `

  wireEvents()
}

function wireEvents() {
  const errBox = document.getElementById('err-box')
  if (errBox) errBox.onclick = () => { state.err = ''; render() }

  document.getElementById('btn-settings').onclick = () => {
    if (!confirm('Sign out? You will need to re-enter the password.')) return
    localStorage.removeItem(LS_UNLOCKED)
    state.unlocked = false
    state.supabase = null
    state.activeSession = null
    state.currentStoppage = null
    render()
  }

  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => {
      state.view = b.dataset.tab
      state.viewSessionId = null
      if (state.view === 'insights') {
        loadInsightsData()
      } else {
        render()
      }
    }
  })

  // Insights date range tabs
  document.querySelectorAll('[data-range]').forEach(b => {
    b.onclick = () => {
      state.insightsRange = b.dataset.range
      loadInsightsData()
    }
  })

  // Workspace switcher (Cutting / Fusing)
  document.querySelectorAll('[data-workspace]').forEach(b => {
    b.onclick = () => { state.workspace = b.dataset.workspace; render() }
  })

  // Fusing tab clicks
  document.querySelectorAll('[data-f-tab]').forEach(b => {
    b.onclick = () => { state.fView = b.dataset.fTab; render() }
  })

  // Fusing start form
  const ffStart = document.getElementById('ff-start')
  if (ffStart) {
    ffStart.onclick = () => {
      fStartSession({
        name: document.getElementById('ff-name').value.trim(),
        panel_count_planned: document.getElementById('ff-count').value,
        operator: document.getElementById('ff-operator').value.trim(),
        machine: document.getElementById('ff-machine').value.trim(),
      })
    }
  }
  // Fusing active session buttons
  const fPanelBtn = document.getElementById('f-panel-btn')
  if (fPanelBtn) fPanelBtn.onclick = () => fLogPanel()
  const fResumeBtn = document.getElementById('f-resume-btn')
  if (fResumeBtn) fResumeBtn.onclick = () => fEndStoppage()
  const fEndBtn = document.getElementById('f-end-session-btn')
  if (fEndBtn) fEndBtn.onclick = () => fEndSession()
  document.querySelectorAll('[data-f-reason-id]').forEach(b => {
    b.onclick = () => {
      const r = state.fReasons.find(x => x.id === b.dataset.fReasonId)
      if (r) fStartStoppage(r)
    }
  })

  // Fusing reasons CRUD
  const frAdd = document.getElementById('fr-add')
  if (frAdd) {
    frAdd.onclick = () => {
      const name = document.getElementById('fr-name').value.trim()
      const cat = document.getElementById('fr-cat').value
      fAddReason(name, cat)
      document.getElementById('fr-name').value = ''
    }
  }
  document.querySelectorAll('[data-f-del-reason]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.fDelReason
      const r = state.fReasons.find(x => x.id === id)
      if (!r) return
      if (confirm(`Delete reason "${r.name}"?\n\nPast stoppages with this name keep their data.`)) {
        fDeleteReason(id)
      }
    }
  })
  document.querySelectorAll('[data-f-edit-reason]').forEach(b => {
    b.onclick = () => fSetEditingReason(b.dataset.fEditReason)
  })
  document.querySelectorAll('[data-f-cancel-reason-edit]').forEach(b => {
    b.onclick = () => fSetEditingReason(null)
  })
  document.querySelectorAll('[data-f-save-reason-edit]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.fSaveReasonEdit
      const nameEl = document.querySelector(`[data-f-edit-reason-name="${id}"]`)
      const catEl = document.querySelector(`[data-f-edit-reason-cat="${id}"]`)
      const histEl = document.querySelector(`[data-f-edit-reason-history="${id}"]`)
      const newName = nameEl.value.trim()
      if (!newName) { alert('Name cannot be empty.'); return }
      const dup = state.fReasons.find(r => r.id !== id && r.name.toLowerCase() === newName.toLowerCase())
      if (dup) { alert(`Another reason already uses the name "${newName}".`); return }
      fUpdateReason(id, { name: newName, category: catEl.value }, histEl.checked)
    }
  })

  // Fusing event edit/delete
  document.querySelectorAll('[data-f-edit-event]').forEach(b => {
    b.onclick = () => fSetEditingEvent(b.dataset.fEditEvent)
  })
  document.querySelectorAll('[data-f-delete-event]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.fDeleteEvent
      const e = state.fEvents.find(x => x.id === id)
      const label = e ? (e.event_type === 'panel' ? 'this panel cycle' : `${e.reason_name} (${fmtDuration(e.duration_seconds || 0)})`) : 'this event'
      if (confirm(`Delete ${label}?`)) fDeleteEvent(id)
    }
  })
  document.querySelectorAll('[data-f-cancel-event-edit]').forEach(b => {
    b.onclick = () => fSetEditingEvent(null)
  })
  document.querySelectorAll('[data-f-save-event-edit]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.fSaveEventEdit
      const existing = state.fEvents.find(e => e.id === id)
      if (!existing) return
      const durEl = document.querySelector(`[data-f-edit-event-duration="${id}"]`)
      const reasonEl = document.querySelector(`[data-f-edit-event-reason="${id}"]`)
      const newDur = parseFloat(durEl.value)
      const changes = {}
      const durChanged = !isNaN(newDur) && Math.abs(newDur - (existing.duration_seconds || 0)) > 0.5
      if (reasonEl) {
        const r = state.fReasons.find(x => x.id === reasonEl.value)
        if (r && r.name !== existing.reason_name) {
          changes.reason_name = r.name
          changes.reason_category = r.category
        }
      }
      if (durChanged) {
        const oldFmt = fmtDuration(existing.duration_seconds || 0)
        const newFmt = fmtDuration(newDur)
        if (!confirm(`Change duration from ${oldFmt} to ${newFmt}?`)) return
        changes.duration_seconds = newDur
      }
      if (Object.keys(changes).length === 0) { fSetEditingEvent(null); return }
      fEditingEventId = null
      fUpdateEvent(id, changes)
    }
  })

  // Start form
  const fType = document.getElementById('f-type')
  if (fType) {
    fType.onchange = () => {
      document.getElementById('f-units-label').textContent =
        fType.value === 'fusing' ? 'Parts in marker' : 'Sizes in marker'
    }
    document.getElementById('f-start').onclick = () => {
      startSession({
        name: document.getElementById('f-name').value.trim(),
        session_type: fType.value,
        marker_length_m: document.getElementById('f-marker').value,
        units_in_marker: document.getElementById('f-units').value,
        plies: document.getElementById('f-plies').value,
        cut_speed_m_per_min: document.getElementById('f-speed').value,
        operator: document.getElementById('f-operator').value.trim(),
        machine: document.getElementById('f-machine').value.trim(),
      })
    }
  }

  // Reason buttons in active session
  document.querySelectorAll('[data-reason-id]').forEach(b => {
    b.onclick = () => {
      const r = state.reasons.find(x => x.id === b.dataset.reasonId)
      if (r) startStoppage(r)
    }
  })
  const resume = document.getElementById('btn-resume')
  if (resume) resume.onclick = () => endStoppage()
  const endBtn = document.getElementById('btn-end-session')
  if (endBtn) endBtn.onclick = () => endSession()
  const exportBtn = document.getElementById('btn-export')
  if (exportBtn) exportBtn.onclick = exportCSV

  // History
  document.querySelectorAll('[data-view-id]').forEach(row => {
    row.onclick = () => viewSession(row.dataset.viewId)
  })
  const back = document.getElementById('btn-back')
  if (back) back.onclick = () => { state.view = 'history'; state.viewSessionId = null; render() }

  // Reasons
  const rAdd = document.getElementById('r-add')
  if (rAdd) {
    rAdd.onclick = () => {
      const name = document.getElementById('r-name').value.trim()
      const cat = document.getElementById('r-cat').value
      addReason(name, cat)
      document.getElementById('r-name').value = ''
    }
  }
  document.querySelectorAll('[data-del-reason]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.delReason
      const r = state.reasons.find(x => x.id === id)
      if (!r) return
      if (confirm(`Delete reason "${r.name}"?\n\nPast stoppages with this name will keep their data, but you won't be able to log new ones with this reason.`)) {
        deleteReason(id)
      }
    }
  })
  document.querySelectorAll('[data-edit-reason]').forEach(b => {
    b.onclick = () => setEditingReason(b.dataset.editReason)
  })
  document.querySelectorAll('[data-cancel-reason-edit]').forEach(b => {
    b.onclick = () => setEditingReason(null)
  })
  document.querySelectorAll('[data-save-reason-edit]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.saveReasonEdit
      const nameInput = document.querySelector(`[data-edit-reason-name="${id}"]`)
      const catSel = document.querySelector(`[data-edit-reason-cat="${id}"]`)
      const histCheck = document.querySelector(`[data-edit-reason-history="${id}"]`)
      const newName = nameInput.value.trim()
      if (!newName) { alert('Name cannot be empty.'); return }
      // Prevent duplicate names
      const dup = state.reasons.find(r => r.id !== id && r.name.toLowerCase() === newName.toLowerCase())
      if (dup) { alert(`Another reason already uses the name "${newName}".`); return }
      updateReason(id, { name: newName, category: catSel.value }, histCheck.checked)
    }
  })

  // Stoppage edit/delete in event log
  document.querySelectorAll('[data-edit-stoppage]').forEach(b => {
    b.onclick = () => setEditingStoppage(b.dataset.editStoppage)
  })
  document.querySelectorAll('[data-delete-stoppage]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.deleteStoppage
      const s = state.stoppages.find(x => x.id === id)
      const label = s ? `${s.reason_name} (${fmtDuration(s.duration_seconds || 0)})` : 'this event'
      if (confirm(`Delete ${label}?`)) deleteStoppage(id)
    }
  })
  document.querySelectorAll('[data-cancel-edit]').forEach(b => {
    b.onclick = () => setEditingStoppage(null)
  })
  document.querySelectorAll('[data-save-edit]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.saveEdit
      const reasonSel = document.querySelector(`[data-edit-reason="${id}"]`)
      const durInput = document.querySelector(`[data-edit-duration="${id}"]`)
      const newReason = state.reasons.find(r => r.id === reasonSel.value)
      const newDur = parseFloat(durInput.value)
      const existing = state.stoppages.find(s => s.id === id)
      if (!existing || !newReason) return

      const changes = {}
      const reasonChanged = newReason.name !== existing.reason_name
      const durChanged = !isNaN(newDur) && Math.abs(newDur - (existing.duration_seconds || 0)) > 0.5

      if (reasonChanged) {
        changes.reason_name = newReason.name
        changes.reason_category = newReason.category
      }
      if (durChanged) {
        // Confirm duration changes (per requirement)
        const oldFmt = fmtDuration(existing.duration_seconds || 0)
        const newFmt = fmtDuration(newDur)
        if (!confirm(`Change duration from ${oldFmt} to ${newFmt}?\n\nThis will update the end time of the stoppage to keep things consistent.`)) {
          return
        }
        changes.duration_seconds = newDur
      }

      if (Object.keys(changes).length === 0) {
        setEditingStoppage(null)
        return
      }

      editingStoppageId = null
      updateStoppage(id, changes)
    }
  })
}

function exportCSV() {
  const s = state.activeSession
  if (!s) return
  const cutSec = cutTimeSec(s), perLay = outputPerLay(s)
  const word = outputWord(s.session_type, true)
  let csv = `Session,Type,Reason,Category,Start,End,Duration (s),Duration (hh:mm:ss),Lays lost,${word.charAt(0).toUpperCase() + word.slice(1)} lost\n`
  state.stoppages.filter(e => e.ended_at).forEach(e => {
    const d = e.duration_seconds || 0
    const lays = cutSec > 0 ? d / cutSec : 0
    const out = Math.round(lays * perLay)
    csv += `"${s.name}","${s.session_type}","${e.reason_name}","${CATEGORIES[e.reason_category].label}","${e.started_at}","${e.ended_at}",${Math.round(d)},${fmtDuration(d)},${lays.toFixed(2)},${out}\n`
  })
  const blob = new Blob([csv], { type: 'text/csv' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `session-${s.name.replace(/[^a-z0-9]/gi, '_')}-${new Date().toISOString().slice(0, 10)}.csv`
  a.click()
  URL.revokeObjectURL(url)
}

// Tick: re-render every second if on active session with state
setInterval(() => {
  if (state.view === 'active' && state.activeSession) render()
}, 1000)

// ============================================================================
// Boot
// ============================================================================
if (localStorage.getItem(LS_UNLOCKED) === '1') {
  state.unlocked = true
  if (initSupabase()) {
    loadAll()
  } else {
    state.loading = false
    render()
  }
} else {
  state.loading = false
  render()
}
</script>
</body>
</html>
