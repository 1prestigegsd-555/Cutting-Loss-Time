<!DOCTYPE html>
<html lang="en">
<head>

<title>Cutting Downtime Tracker</title>
<style>
  :root {
    --bg: #fafaf7; --surface: #fff; --surface-2: #f4f3ee;
    --border: rgba(0,0,0,.12); --border-strong: rgba(0,0,0,.25);
    --text: #1a1a1a; --text-2: #5f5e5a; --text-3: #888780;
    --success-bg: #EAF3DE; --success-border: #639922; --success-text: #27500A;
    --warning-bg: #FAEEDA; --warning-text: #633806;
    --danger-bg: #FCEBEB; --danger-border: #E24B4A; --danger-text: #791F1F;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1a; --surface: #262624; --surface-2: #2f2f2d;
      --border: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.25);
      --text: #f5f4ef; --text-2: #b4b2a9; --text-3: #888780; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  .app { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 .25rem; }
  .sub { font-size: 13px; color: var(--text-2); }
  .card-surface { background: var(--surface-2); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .card-title { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
  input, select, button, textarea { font: inherit; color: inherit; background: var(--surface);
    border: .5px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none; }
  input:focus, select:focus { border-color: var(--border-strong); }
  input[type="number"], input[type="text"] { width: 100%; }
  label.inline { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 4px; }
  button { cursor: pointer; transition: background .15s, transform .05s; }
  button:hover { background: var(--surface-2); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-success { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); font-weight: 500; }
  .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
  .btn-ghost { border: none; color: var(--text-2); padding: 4px 8px; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat { background: var(--surface-2); border-radius: 8px; padding: .9rem 1rem; }
  .stat-label { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .status-row { display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 1rem; }
  .status-label { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .status-value { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .banner { padding: 12px 16px; background: var(--warning-bg); color: var(--warning-text);
    border-radius: 8px; margin-bottom: 1rem; font-size: 14px; }
  .reason-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .reason-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 10px 12px; font-size: 13px; text-align: left; }
  .reason-btn .name { font-weight: 500; }
  .reason-btn .cat { font-size: 11px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .table-row { display: grid; align-items: center; padding: 6px 0; border-bottom: .5px solid var(--border); gap: 12px; }
  .table-row:last-child { border-bottom: none; }
  .muted { color: var(--text-2); }
  .tabular { font-variant-numeric: tabular-nums; }
  .log-box { background: var(--surface); border: .5px solid var(--border); border-radius: 8px;
    padding: 12px; font-size: 13px; max-height: 260px; overflow-y: auto; }
  .empty { color: var(--text-2); font-size: 13px; padding: 12px; background: var(--surface);
    border: .5px solid var(--border); border-radius: 8px; }
  .error { background: var(--danger-bg); color: var(--danger-text); padding: 12px 16px;
    border-radius: 8px; margin-bottom: 1rem; font-size: 14px; cursor: pointer; }
  .flex { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .grow { flex: 1; }
  .tabs { display: flex; gap: 4px; border-bottom: .5px solid var(--border); margin-bottom: 1rem; }
  .tab { padding: 8px 14px; border: none; background: transparent; color: var(--text-2);
    border-bottom: 2px solid transparent; border-radius: 0; cursor: pointer; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab:hover { background: var(--surface-2); color: var(--text); }
  .insight { font-size: 13px; color: var(--text-2); margin-top: 8px; }
  .insight strong { color: var(--text); font-weight: 500; }
  svg text { fill: var(--text); }
  .config-panel { background: var(--surface-2); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
  .config-panel code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>

<!-- Your config. Edit config.js, not this file. -->
<script src="config.js"></script>

<script type="module">
import { createClient } from '@supabase/supabase-js'

// Config is loaded from config.js (kept separate so you never edit index.html).
// If config.js is missing or the placeholders weren't filled in, the app shows a setup message.
const CFG = window.APP_CONFIG || {}
const SUPABASE_URL      = CFG.SUPABASE_URL      || ''
const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || ''
const PASSWORD_HASH     = CFG.PASSWORD_HASH     || ''

const LS_UNLOCKED = 'cdt_unlocked_v1'  // remember-me flag

const CATEGORIES = {
  man:      { label: 'Man',      color: '#534AB7', fill: '#EEEDFE', dark: '#26215C' },
  material: { label: 'Material', color: '#0F6E56', fill: '#E1F5EE', dark: '#04342C' },
  method:   { label: 'Method',   color: '#993C1D', fill: '#FAECE7', dark: '#4A1B0C' },
  nature:   { label: 'Machine',  color: '#185FA5', fill: '#E6F1FB', dark: '#042C53' },
}

function fmtDuration(s) {
  s = Math.max(0, Math.floor(s || 0))
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60
  return [h, m, sec].map(n => String(n).padStart(2, '0')).join(':')
}
function fmtTime(d) { return d ? new Date(d).toTimeString().slice(0, 8) : '' }
function outputWord(type, plural = true) {
  if (type === 'fusing') return plural ? 'parts' : 'part'
  return plural ? 'garments' : 'garment'
}
// Estimate how long one lay takes to cut.
// Since one session = one lay, we use this session's uptime-so-far as the
// cut-time estimate. Simple and self-consistent: "lays lost" becomes
// downtime ÷ uptime, which directly answers "how many more lays could I have
// cut in the time the machine was stopped?"
//
// Returns { seconds, source } where source is:
//   'self'        — using this session's accumulated uptime
//   'history'     — session has no uptime yet, use last session's actual speed
//   'theoretical' — no history either, fall back to cut_speed_m_per_min
//   'none'        — can't estimate
function estimateCutTime(session, sessionUptimeSec) {
  if (!session) return { seconds: 0, source: 'none' }
  const markerLen = Number(session.marker_length_m) || 0
  if (!markerLen) return { seconds: 0, source: 'none' }

  // Case 1: this session has meaningful uptime — that IS the cut time for this lay
  if (sessionUptimeSec > 30) {   // at least 30 seconds of uptime to be meaningful
    return { seconds: sessionUptimeSec, source: 'self' }
  }

  // Case 2: very early in a new session — use last completed session's speed
  if (state.recentActualSpeed && state.recentActualSpeed.speed_m_per_min > 0) {
    const sec = (markerLen / state.recentActualSpeed.speed_m_per_min) * 60
    return { seconds: sec, source: 'history', fromName: state.recentActualSpeed.from_session_name }
  }

  // Case 3: no history — theoretical fallback
  if (session.cut_speed_m_per_min > 0) {
    return { seconds: (markerLen / session.cut_speed_m_per_min) * 60, source: 'theoretical' }
  }
  return { seconds: 0, source: 'none' }
}

// Kept for backwards compat (historical session detail view still uses it for perLay math).
function cutTimeSec(s) {
  return s && s.cut_speed_m_per_min ? (s.marker_length_m / s.cut_speed_m_per_min) * 60 : 0
}
function outputPerLay(s) { return (s.units_in_marker || 0) * (s.plies || 0) }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild }

// ============================================================================
// State
// ============================================================================
const state = {
  supabase: null,
  unlocked: false,
  workspace: 'cutting',  // 'cutting' | 'fusing'

  // ── Cutting workspace state ────────────────────────────────────────────
  reasons: [],
  sessions: [],
  activeSession: null,
  currentStoppage: null,
  stoppages: [],
  view: 'list', // list | active | history | detail | reasons | setup | insights
  viewSessionId: null,
  recentActualSpeed: null,
  insightsRange: 'week',
  insightsData: null,

  // ── Fusing workspace state ─────────────────────────────────────────────
  fReasons: [],
  fSessions: [],
  fActiveSession: null,
  fEvents: [],
  fCurrentPanel: null,
  fCurrentStoppage: null,
  fView: 'list',
  fViewSessionId: null,

  // ── Shared ─────────────────────────────────────────────────────────────
  err: '',
  loading: true,
}

// ============================================================================
// Supabase helpers
// ============================================================================
function initSupabase() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !PASSWORD_HASH) {
    state.err = 'Configuration missing. Make sure config.js sits next to index.html with all three values filled in. See README.md.'
    return false
  }
  if (SUPABASE_URL.includes('YOUR-PROJECT-REF') || SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY') || PASSWORD_HASH.includes('YOUR-SHA256-HASH')) {
    state.err = 'config.js still has placeholder values. Edit config.js and replace the three YOUR-... values with real ones.'
    return false
  }
  try {
    state.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    return true
  } catch (e) { state.err = e.message; return false }
}

async function sha256Hex(text) {
  const buf = new TextEncoder().encode(text)
  const hash = await crypto.subtle.digest('SHA-256', buf)
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('')
}

async function sbReasons() {
  const { data, error } = await state.supabase.from('reasons').select('*').order('created_at')
  if (error) throw error
  return data || []
}
async function sbSessions() {
  const { data, error } = await state.supabase.from('sessions').select('*')
    .order('started_at', { ascending: false }).limit(200)
  if (error) throw error
  return data || []
}
async function sbStoppages(sessionId) {
  const { data, error } = await state.supabase.from('stoppages').select('*')
    .eq('session_id', sessionId).order('started_at')
  if (error) throw error
  return data || []
}
async function sbOpenSession() {
  const { data, error } = await state.supabase.from('sessions').select('*')
    .is('ended_at', null).order('started_at', { ascending: false }).limit(1)
  if (error) throw error
  return (data || [])[0] || null
}
async function sbOpenStoppage(sessionId) {
  const { data, error } = await state.supabase.from('stoppages').select('*')
    .eq('session_id', sessionId).is('ended_at', null).limit(1)
  if (error) throw error
  return (data || [])[0] || null
}

// Find the most recent completed session, load its stoppages, and compute its
// actual effective cut speed in m/min. Caches result in state.recentActualSpeed.
async function refreshRecentActualSpeed(excludeSessionId) {
  const completed = state.sessions
    .filter(s => s.ended_at && s.marker_length_m > 0 && s.id !== excludeSessionId)
    .sort((a, b) => new Date(b.ended_at) - new Date(a.ended_at))
  if (!completed.length) {
    state.recentActualSpeed = null
    return
  }
  const latest = completed[0]
  try {
    const stops = await sbStoppages(latest.id)
    const totalDown = stops.reduce((a, s) => a + (s.duration_seconds || 0), 0)
    const sessionSec = (new Date(latest.ended_at) - new Date(latest.started_at)) / 1000
    const uptimeSec = Math.max(0, sessionSec - totalDown)
    const uptimeMin = uptimeSec / 60
    if (uptimeMin > 0.05) {
      state.recentActualSpeed = {
        speed_m_per_min: latest.marker_length_m / uptimeMin,
        from_session_name: latest.name,
      }
    } else {
      state.recentActualSpeed = null
    }
  } catch (e) {
    // Silent — fall back to theoretical if this fails
    state.recentActualSpeed = null
  }
}

function rangeStart(range) {
  const now = new Date()
  if (range === 'today') {
    const d = new Date(now); d.setHours(0, 0, 0, 0); return d
  }
  if (range === 'week') {
    const d = new Date(now); d.setDate(d.getDate() - 7); return d
  }
  if (range === 'month') {
    const d = new Date(now); d.setDate(d.getDate() - 30); return d
  }
  return new Date(0) // 'all'
}

// Load all stoppages for sessions that started within the selected range.
// Cached in state.insightsData.
async function loadInsightsData() {
  state.insightsData = { sessions: [], stoppages: [], loading: true }
  render()
  try {
    const fromIso = rangeStart(state.insightsRange).toISOString()
    const { data: sessionsInRange, error: sErr } = await state.supabase
      .from('sessions').select('*')
      .gte('started_at', fromIso)
      .order('started_at', { ascending: true })
    if (sErr) throw sErr
    if (!sessionsInRange || sessionsInRange.length === 0) {
      state.insightsData = { sessions: [], stoppages: [], loading: false }
      render(); return
    }
    const sessionIds = sessionsInRange.map(s => s.id)
    const { data: stops, error: stErr } = await state.supabase
      .from('stoppages').select('*')
      .in('session_id', sessionIds)
      .not('ended_at', 'is', null)
    if (stErr) throw stErr
    state.insightsData = { sessions: sessionsInRange, stoppages: stops || [], loading: false }
    render()
  } catch (e) {
    state.err = e.message
    state.insightsData = { sessions: [], stoppages: [], loading: false }
    render()
  }
}

// ============================================================================
// Actions
// ============================================================================
async function loadAll() {
  try {
    state.loading = true; render()
    state.reasons = await sbReasons()
    state.sessions = await sbSessions()
    const open = await sbOpenSession()
    if (open) {
      state.activeSession = open
      state.stoppages = await sbStoppages(open.id)
      state.currentStoppage = await sbOpenStoppage(open.id)
      state.view = 'active'
    }
    await refreshRecentActualSpeed(state.activeSession?.id)

    // Fusing workspace data — fail soft if tables not migrated
    try {
      state.fReasons = await fbReasons()
      state.fSessions = await fbSessions()
      const fOpen = await fbOpenSession()
      if (fOpen) {
        state.fActiveSession = fOpen
        state.fEvents = await fbEvents(fOpen.id)
        state.fCurrentPanel = state.fEvents.find(e => e.event_type === 'panel' && !e.ended_at) || null
        state.fCurrentStoppage = state.fEvents.find(e => e.event_type === 'stoppage' && !e.ended_at) || null
        state.fView = 'active'
      }
    } catch (e) { console.warn('Fusing tables unavailable:', e.message) }

    state.loading = false
    render()
  } catch (e) { state.err = e.message; state.loading = false; render() }
}

// ─── Fusing Supabase helpers ────────────────────────────────────────────────
async function fbReasons() {
  const { data, error } = await state.supabase.from('fusing_reasons').select('*').order('created_at')
  if (error) throw error
  return data || []
}
async function fbSessions() {
  const { data, error } = await state.supabase.from('fusing_sessions').select('*')
    .order('started_at', { ascending: false }).limit(200)
  if (error) throw error
  return data || []
}
async function fbEvents(sessionId) {
  const { data, error } = await state.supabase.from('fusing_events').select('*')
    .eq('session_id', sessionId).order('started_at')
  if (error) throw error
  return data || []
}
async function fbOpenSession() {
  const { data, error } = await state.supabase.from('fusing_sessions').select('*')
    .is('ended_at', null).order('started_at', { ascending: false }).limit(1)
  if (error) throw error
  return (data || [])[0] || null
}

// ─── Fusing actions ─────────────────────────────────────────────────────────
async function fStartSession(form) {
  try {
    const payload = {
      name: form.name || 'Untitled bundle',
      panel_count_planned: form.panel_count_planned ? Number(form.panel_count_planned) : null,
      operator: form.operator || null,
      machine: form.machine || null,
    }
    const { data, error } = await state.supabase.from('fusing_sessions').insert(payload).select().single()
    if (error) throw error
    state.fSessions.unshift(data)
    state.fActiveSession = data
    state.fEvents = []; state.fCurrentPanel = null; state.fCurrentStoppage = null
    state.fView = 'active'
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fEndSession() {
  if (!state.fActiveSession) return
  if (state.fCurrentStoppage) await fEndStoppage()
  if (state.fCurrentPanel) await fEndCurrentPanel()
  if (!confirm(`End fusing session "${state.fActiveSession.name}"?`)) return
  try {
    const { data, error } = await state.supabase.from('fusing_sessions')
      .update({ ended_at: new Date().toISOString() })
      .eq('id', state.fActiveSession.id).select().single()
    if (error) throw error
    const idx = state.fSessions.findIndex(s => s.id === data.id)
    if (idx >= 0) state.fSessions[idx] = data
    state.fActiveSession = null; state.fCurrentPanel = null; state.fCurrentStoppage = null
    state.fView = 'list'
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fLogPanel() {
  if (!state.fActiveSession) return
  if (state.fCurrentStoppage) await fEndStoppage()
  if (state.fCurrentPanel) await fEndCurrentPanel()
  try {
    const { data, error } = await state.supabase.from('fusing_events').insert({
      session_id: state.fActiveSession.id, event_type: 'panel',
    }).select().single()
    if (error) throw error
    state.fEvents.push(data)
    state.fCurrentPanel = data
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fEndCurrentPanel() {
  if (!state.fCurrentPanel) return
  const endedAt = new Date()
  const dur = Math.max(0, (endedAt - new Date(state.fCurrentPanel.started_at)) / 1000)
  try {
    const { data, error } = await state.supabase.from('fusing_events')
      .update({ ended_at: endedAt.toISOString(), duration_seconds: dur })
      .eq('id', state.fCurrentPanel.id).select().single()
    if (error) throw error
    const idx = state.fEvents.findIndex(e => e.id === data.id)
    if (idx >= 0) state.fEvents[idx] = data
    state.fCurrentPanel = null
  } catch (e) { state.err = e.message; render() }
}

async function fStartStoppage(reason) {
  if (!state.fActiveSession) return
  if (state.fCurrentStoppage) await fEndStoppage()
  if (state.fCurrentPanel) await fEndCurrentPanel()
  try {
    const { data, error } = await state.supabase.from('fusing_events').insert({
      session_id: state.fActiveSession.id, event_type: 'stoppage',
      reason_name: reason.name, reason_category: reason.category,
    }).select().single()
    if (error) throw error
    state.fEvents.push(data)
    state.fCurrentStoppage = data
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fEndStoppage() {
  if (!state.fCurrentStoppage) return
  const endedAt = new Date()
  const dur = Math.max(0, (endedAt - new Date(state.fCurrentStoppage.started_at)) / 1000)
  try {
    const { data, error } = await state.supabase.from('fusing_events')
      .update({ ended_at: endedAt.toISOString(), duration_seconds: dur })
      .eq('id', state.fCurrentStoppage.id).select().single()
    if (error) throw error
    const idx = state.fEvents.findIndex(e => e.id === data.id)
    if (idx >= 0) state.fEvents[idx] = data
    state.fCurrentStoppage = null
    render()
  } catch (e) { state.err = e.message; render() }
}

// ─── Fusing reason CRUD ─────────────────────────────────────────────────────
async function fAddReason(name, category) {
  if (!name) return
  if (state.fReasons.some(r => r.name.toLowerCase() === name.toLowerCase())) {
    state.err = `Reason "${name}" already exists.`; render(); return
  }
  try {
    const { data, error } = await state.supabase.from('fusing_reasons')
      .insert({ name, category, is_default: false }).select().single()
    if (error) throw error
    state.fReasons.push(data); render()
  } catch (e) { state.err = e.message; render() }
}

async function fDeleteReason(id) {
  if (state.fReasons.length <= 1) { alert('Keep at least one fusing reason.'); return }
  try {
    const { error } = await state.supabase.from('fusing_reasons').delete().eq('id', id)
    if (error) throw error
    state.fReasons = state.fReasons.filter(x => x.id !== id); render()
  } catch (e) { state.err = e.message; render() }
}

async function fUpdateReason(id, changes, applyToHistory) {
  try {
    const existing = state.fReasons.find(r => r.id === id)
    if (!existing) return
    const payload = {}
    if (changes.name && changes.name !== existing.name) payload.name = changes.name
    if (changes.category && changes.category !== existing.category) payload.category = changes.category
    if (Object.keys(payload).length === 0) return

    const { data, error } = await state.supabase.from('fusing_reasons')
      .update(payload).eq('id', id).select().single()
    if (error) throw error
    const idx = state.fReasons.findIndex(r => r.id === id)
    if (idx >= 0) state.fReasons[idx] = data

    if (applyToHistory) {
      const evtUpdate = {}
      if (payload.name) evtUpdate.reason_name = payload.name
      if (payload.category) evtUpdate.reason_category = payload.category
      if (Object.keys(evtUpdate).length > 0) {
        const { error: evtErr } = await state.supabase.from('fusing_events')
          .update(evtUpdate)
          .eq('event_type', 'stoppage')
          .eq('reason_name', existing.name)
        if (evtErr) throw evtErr
        if (state.fActiveSession) {
          state.fEvents = await fbEvents(state.fActiveSession.id)
        }
      }
    }
    fEditingReasonId = null
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fUpdateEvent(eventId, changes) {
  try {
    const existing = state.fEvents.find(e => e.id === eventId)
    if (!existing) return
    const payload = {}
    if (existing.event_type === 'stoppage' && changes.reason_name && changes.reason_category) {
      payload.reason_name = changes.reason_name
      payload.reason_category = changes.reason_category
    }
    if (typeof changes.duration_seconds === 'number') {
      const newDur = Math.max(0, changes.duration_seconds)
      payload.duration_seconds = newDur
      payload.ended_at = new Date(new Date(existing.started_at).getTime() + newDur * 1000).toISOString()
    }
    if (Object.keys(payload).length === 0) return
    const { data, error } = await state.supabase.from('fusing_events')
      .update(payload).eq('id', eventId).select().single()
    if (error) throw error
    const idx = state.fEvents.findIndex(e => e.id === data.id)
    if (idx >= 0) state.fEvents[idx] = data
    fEditingEventId = null
    render()
  } catch (e) { state.err = e.message; render() }
}

async function fDeleteEvent(eventId) {
  try {
    const { error } = await state.supabase.from('fusing_events').delete().eq('id', eventId)
    if (error) throw error
    state.fEvents = state.fEvents.filter(e => e.id !== eventId)
    if (state.fCurrentPanel && state.fCurrentPanel.id === eventId) state.fCurrentPanel = null
    if (state.fCurrentStoppage && state.fCurrentStoppage.id === eventId) state.fCurrentStoppage = null

}

async function startSession(form) {

      units_in_marker: Number(form.units_in_marker) || 0,

async function endSession() {
  if (!state.activeSession) return
  if (state.currentStoppage) await endStoppage()
  if (!confirm(`End session "${state.activeSession.name}"?`)) return
  try {
    const { data, error } = await state.supabase.from('sessions')
      .update({ ended_at: new Date().toISOString() })
      .eq('id', state.activeSession.id).select().single()
    if (error) throw error
    const idx = state.sessions.findIndex(s => s.id === data.id)
    if (idx >= 0) state.sessions[idx] = data
    state.activeSession = null
    state.currentStoppage = null
    state.view = 'list'
    await refreshRecentActualSpeed()  // this session just joined history
    render()
  } catch (e) { state.err = e.message; render() }
}

async function startStoppage(reason) {
  if (!state.activeSession) return
  if (state.currentStoppage) await endStoppage()
  try {
    const { data, error } = await state.supabase.from('stoppages').insert({
      session_id: state.activeSession.id,
      reason_name: reason.name,
      reason_category: reason.category,
    }).select().single()
    if (error) throw error
    state.stoppages.push(data)
    state.currentStoppage = data
    render()
  } catch (e) { state.err = e.message; render() }
}

async function endStoppage() {
  if (!state.currentStoppage) return
  const endedAt = new Date()
  const startedAt = new Date(state.currentStoppage.started_at)
  const dur = Math.max(0, (endedAt - startedAt) / 1000)
  try {
    const { data, error } = await state.supabase.from('stoppages')
      .update({ ended_at: endedAt.toISOString(), duration_seconds: dur })
      .eq('id', state.currentStoppage.id).select().single()
    if (error) throw error
    const idx = state.stoppages.findIndex(s => s.id === data.id)
    if (idx >= 0) state.stoppages[idx] = data
    state.currentStoppage = null
    render()
  } catch (e) { state.err = e.message; render() }
}

// Update an existing (already-ended) stoppage. Can change reason and/or duration.
async function updateStoppage(stoppageId, changes) {
  try {
    // If duration is changing, recompute ended_at to keep started_at + duration consistent
    const existing = state.stoppages.find(s => s.id === stoppageId)
    if (!existing) return
    const payload = {}
    if (changes.reason_name && changes.reason_category) {
      payload.reason_name = changes.reason_name
      payload.reason_category = changes.reason_category
    }
    if (typeof changes.duration_seconds === 'number') {
      const newDur = Math.max(0, changes.duration_seconds)
      payload.duration_seconds = newDur
      payload.ended_at = new Date(new Date(existing.started_at).getTime() + newDur * 1000).toISOString()
    }
    if (Object.keys(payload).length === 0) return
    const { data, error } = await state.supabase.from('stoppages')
      .update(payload).eq('id', stoppageId).select().single()
    if (error) throw error
    const idx = state.stoppages.findIndex(s => s.id === data.id)
    if (idx >= 0) state.stoppages[idx] = data
    // Invalidate insights cache since the data changed
    state.insightsData = null
    render()
  } catch (e) { state.err = e.message; render() }
}

async function deleteStoppage(stoppageId) {
  try {
    const { error } = await state.supabase.from('stoppages').delete().eq('id', stoppageId)
    if (error) throw error
    state.stoppages = state.stoppages.filter(s => s.id !== stoppageId)
    if (state.currentStoppage && state.currentStoppage.id === stoppageId) {

    render()

}

// Update a reason's name and/or category. Optionally also rewrites all historical
// stoppages with the same reason_name so old data reflects the new categorisation.
async function updateReason(id, changes, applyToHistory) {
  try {
    const existing = state.reasons.find(r => r.id === id)
    if (!existing) return
    const payload = {}
    if (changes.name && changes.name !== existing.name) payload.name = changes.name
    if (changes.category && changes.category !== existing.category) payload.category = changes.category
    if (Object.keys(payload).length === 0) return

    const { data, error } = await state.supabase.from('reasons')
      .update(payload).eq('id', id).select().single()
    if (error) throw error
    const idx = state.reasons.findIndex(r => r.id === id)
    if (idx >= 0) state.reasons[idx] = data

    // Rewrite historical stoppages if requested
    if (applyToHistory) {
      const stopUpdate = {}
      if (payload.name) stopUpdate.reason_name = payload.name
      if (payload.category) stopUpdate.reason_category = payload.category
      if (Object.keys(stopUpdate).length > 0) {
        // Match by the OLD name (existing.name) so we update all historical rows tagged that way
        const { error: stopErr } = await state.supabase.from('stoppages')
          .update(stopUpdate).eq('reason_name', existing.name)
        if (stopErr) throw stopErr
        // Refresh in-memory stoppages for current/viewed session
        if (state.activeSession) {
          state.stoppages = await sbStoppages(state.activeSession.id)
        } else if (state.viewSessionId) {
          state.stoppages = await sbStoppages(state.viewSessionId)
        }
      }
    }
    state.insightsData = null  // force reload of insights aggregates
    editingReasonId = null
    render()
  } catch (e) { state.err = e.message; render() }
}

function breakdownFor(stoppages, currentStoppage) {
  const b = {}
  stoppages.forEach(s => {
    if (s.ended_at) b[s.reason_name] = (b[s.reason_name] || 0) + (s.duration_seconds || 0)
  })
  if (currentStoppage) {
    const dur = (new Date() - new Date(currentStoppage.started_at)) / 1000
    b[currentStoppage.reason_name] = (b[currentStoppage.reason_name] || 0) + dur
  }
  return b
}

function renderCutSpeedComparison(session, uptimeSec, editable) {
  const theoretical = Number(session.cut_speed_m_per_min) || 0
  const markerLen = Number(session.marker_length_m) || 0

  // One session = one lay. Actual cut speed = marker length ÷ uptime minutes.
  // Uptime already excludes all logged downtime, so this is real cutting time.
  const uptimeMin = uptimeSec / 60
  const actual = (uptimeMin > 0.05) ? markerLen / uptimeMin : 0   // ignore tiny uptimes (< 3 sec)
  const ratio = (actual > 0 && theoretical > 0) ? (actual / theoretical) * 100 : 0
  const hasData = actual > 0

  let interp = ''
  if (!hasData) {
    interp = `<span class="muted">Actual speed will appear once the session has accumulated some uptime.</span>`
  } else if (ratio >= 95) {
    interp = `<strong>Matches theoretical.</strong> Your entered cut speed is realistic for this marker.`
  } else if (ratio >= 75) {
    interp = `<strong>Running close to theoretical.</strong> Small gap is normal — cut path overhead, notches, internal cuts.`
  } else if (ratio >= 40) {
    interp = `<strong>Actual is meaningfully below theoretical.</strong> The theoretical input is likely too optimistic — it treats cut path as equal to marker length, but the real head travel is longer (perimeters of pieces + notches). Consider lowering the cut speed input so "lays lost" stays accurate.`
  } else {
    interp = `<strong>Actual is far below theoretical.</strong> Either the cut speed input is wildly optimistic, or the session is still mid-cut and uptime is being overstated relative to work done. Re-check once the session has ended.`
  }

  return `
    <div class="card-surface">
      <div class="card-title">Cut speed — actual vs theoretical</div>
      <div class="grid grid-3">
        <div class="stat">
          <div class="stat-label">Theoretical (entered)</div>
          <div class="stat-value">${theoretical.toFixed(1)}</div>
          <div class="stat-sub">m/min</div>
        </div>
        <div class="stat">
          <div class="stat-label">Actual effective</div>
          <div class="stat-value">${hasData ? actual.toFixed(1) : '—'}</div>
          <div class="stat-sub">${hasData ? `${markerLen}m marker ÷ ${uptimeMin.toFixed(1)} min uptime` : 'waiting for uptime'}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Actual ÷ theoretical</div>
          <div class="stat-value">${ratio > 0 ? Math.round(ratio) + '%' : '—'}</div>
          <div class="stat-sub">${ratio > 0 ? (ratio >= 95 ? 'matches' : ratio >= 75 ? 'close' : ratio >= 40 ? 'below theory' : 'far below') : ''}</div>
        </div>
      </div>
      <div class="insight" style="margin-top: 10px;">${interp}</div>
    </div>
  `
}

function renderBreakdown(breakdown, totalDown, cutSec, perLay, word) {
  if (totalDown === 0) return `<div class="empty">No stoppages recorded yet.</div>`
  const rows = Object.entries(breakdown).sort((a, b) => b[1] - a[1])
  return `<div class="log-box" style="max-height:none;">
    ${rows.map(([name, dur]) => {
      const pct = Math.round((dur / totalDown) * 100)
      const lays = cutSec > 0 ? dur / cutSec : 0
      const out = Math.round(lays * perLay)
      const cat = CATEGORIES[getCategory(name)]
      return `<div class="table-row" style="grid-template-columns:1fr auto auto auto auto;">
        <div style="font-weight:500;">${esc(name)}</div>
        <div class="pill" style="background:${cat.fill}; color:${cat.dark};">${cat.label}</div>
        <div class="muted tabular">${fmtDuration(dur)}</div>
        <div class="muted" style="min-width:36px; text-align:right;">${pct}%</div>
        <div class="muted" style="min-width:100px; text-align:right;">${lays.toFixed(1)} lays / ${out.toLocaleString()} ${word}</div>
      </div>`
    }).join('')}
  </div>`
}

function renderPareto(breakdown, totalDown) {
  const entries = Object.entries(breakdown).sort((a, b) => b[1] - a[1])
  if (!entries.length || !totalDown) return `<div class="empty">Record some stoppages to see the Pareto.</div>`
  const W = 640, H = 260, padL = 45, padR = 50, padT = 20, padB = 70
  const plotW = W - padL - padR, plotH = H - padT - padB
  const slotW = plotW / entries.length, barW = slotW * 0.7, barGap = slotW * 0.3
  const maxVal = entries[0][1]
  let cumul = 0
  const pts = entries.map((e, i) => {
    cumul += e[1]
    return { x: padL + i * (barW + barGap) + barW / 2, y: padT + plotH - (cumul / totalDown) * plotH }
  })
  let running = 0, vital = []
  for (const e of entries) { running += e[1]; vital.push(e[0]); if (running / totalDown >= 0.8) break }
  const vitalPct = Math.round((vital.length / entries.length) * 100)
  const coverPct = Math.round((running / totalDown) * 100)
  const y80 = padT + plotH - 0.8 * plotH

  let bars = '', labels = ''
  entries.forEach(([name, dur], i) => {
    const cat = CATEGORIES[getCategory(name)]
    const barH = (dur / maxVal) * plotH
    const x = padL + i * (barW + barGap)
    const y = padT + plotH - barH
    const pct = Math.round((dur / totalDown) * 100)
    const lx = x + barW / 2, ly = padT + plotH + 12
    const short = name.length > 14 ? name.slice(0, 13) + '…' : name
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${cat.fill}" stroke="${cat.color}" stroke-width="0.5"/>
      <text x="${x + barW/2}" y="${y - 4}" font-size="11" font-weight="500" text-anchor="middle" fill="${cat.dark}">${pct}%</text>
      <text x="${lx}" y="${ly}" font-size="10.5" text-anchor="end" fill="var(--text-2)" transform="rotate(-35 ${lx} ${ly})">${esc(short)}</text>`
  })
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ' ' + p.y).join(' ')
  const dots = pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#185FA5"/>`).join('')
  const ticks = [0, 25, 50, 75, 100].map(t => {
    const y = padT + plotH - (t / 100) * plotH
    return `<text x="${W - padR + 4}" y="${y + 3}" font-size="10" fill="var(--text-3)">${t}%</text>`
  }).join('')
  const vitalList = vital.map(v => `<span style="color:${CATEGORIES[getCategory(v)].color};">${esc(v)}</span>`).join(', ')

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:300px;">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="var(--border-strong)" stroke-width="0.5"/>
    <line x1="${W - padR}" y1="${padT}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--border-strong)" stroke-width="0.5"/>
    <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--border-strong)" stroke-width="0.5"/>
    <line x1="${padL}" y1="${y80}" x2="${W - padR}" y2="${y80}" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="${W - padR + 4}" y="${y80 + 4}" font-size="10" fill="#A32D2D">80%</text>
    ${bars}
    <path d="${path}" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    ${dots}${ticks}
  </svg>
  <div class="insight"><strong>Vital few:</strong> ${vital.length} of ${entries.length} reasons (${vitalPct}%) drive ${coverPct}% of downtime — ${vitalList}.</div>`
}

function renderFishbone(breakdown, totalDown) {
  if (!totalDown) return `<div class="empty">Record some stoppages to see the fishbone.</div>`
  const byCategory = { man: [], material: [], method: [], nature: [] }
  Object.entries(breakdown).forEach(([reason, dur]) => {
    byCategory[getCategory(reason)].push({ reason, dur, pct: (dur / totalDown) * 100 })
  })
  Object.keys(byCategory).forEach(k => byCategory[k].sort((a, b) => b.dur - a.dur))
  const W = 680, H = 340, spineY = H / 2
  const spineStartX = 40, spineEndX = W - 120, headX = W - 110
  const ribs = [
    { cat: 'man',      top: true,  left: true,  x: spineStartX + (spineEndX - spineStartX) * 0.22 },
    { cat: 'method',   top: true,  left: false, x: spineStartX + (spineEndX - spineStartX) * 0.72 },
    { cat: 'material', top: false, left: true,  x: spineStartX + (spineEndX - spineStartX) * 0.22 },
    { cat: 'nature',   top: false, left: false, x: spineStartX + (spineEndX - spineStartX) * 0.72 },
  ]
  let ribsSvg = ''
  ribs.forEach(rib => {
    const cat = CATEGORIES[rib.cat]
    const items = byCategory[rib.cat]
    const catDur = items.reduce((a, b) => a + b.dur, 0)
    const catPct = Math.round((catDur / totalDown) * 100)
    const ribEndY = rib.top ? spineY - 130 : spineY + 130
    const ribEndX = rib.x + (rib.top === rib.left ? -60 : 60)
    const labelY = rib.top ? ribEndY - 8 : ribEndY + 16
    const maxItems = Math.min(items.length, 4)
    ribsSvg += `<line x1="${rib.x}" y1="${spineY}" x2="${ribEndX}" y2="${ribEndY}" stroke="${cat.color}" stroke-width="1.2"/>
      <text x="${ribEndX}" y="${labelY}" font-size="12" font-weight="500" text-anchor="middle" fill="${cat.color}">${cat.label} · ${catPct}%</text>`
    for (let i = 0; i < maxItems; i++) {
      const t = (i + 1) / (maxItems + 1)
      const bx = rib.x + (ribEndX - rib.x) * t
      const by = spineY + (ribEndY - spineY) * t
      const bEndX = bx + (rib.left ? -45 : 45)
      const item = items[i]
      const anchor = rib.left ? 'end' : 'start'
      const tx = bEndX + (rib.left ? -4 : 4)
      const short = item.reason.length > 16 ? item.reason.slice(0, 15) + '…' : item.reason
      ribsSvg += `<line x1="${bx}" y1="${by}" x2="${bEndX}" y2="${by}" stroke="${cat.color}" stroke-width="0.8" opacity="0.7"/>
        <text x="${tx}" y="${by - 2}" font-size="10.5" text-anchor="${anchor}">${esc(short)}</text>
        <text x="${tx}" y="${by + 10}" font-size="10" text-anchor="${anchor}" fill="var(--text-2)">${Math.round(item.pct)}% · ${fmtDuration(item.dur)}</text>`
    }
    if (!items.length) {
      ribsSvg += `<text x="${(rib.x + ribEndX) / 2}" y="${(spineY + ribEndY) / 2}" font-size="10" text-anchor="middle" fill="var(--text-3)" font-style="italic">no events</text>`
    }
  })
  const catTotals = Object.entries(byCategory).map(([k, arr]) => ({
    cat: k, label: CATEGORIES[k].label, dur: arr.reduce((a, b) => a + b.dur, 0), color: CATEGORIES[k].color,
  })).sort((a, b) => b.dur - a.dur)
  const dom = catTotals[0]
  const domPct = dom && dom.dur ? Math.round((dom.dur / totalDown) * 100) : 0
  const insight = dom && dom.dur > 0
    ? `<div class="insight"><strong>Dominant category:</strong> <span style="color:${dom.color};">${dom.label}</span> accounts for ${domPct}% of total downtime (${fmtDuration(dom.dur)}). Focus improvement efforts here first.</div>`
    : ''

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:360px;">
    <line x1="${spineStartX}" y1="${spineY}" x2="${spineEndX}" y2="${spineY}" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="${spineEndX},${spineY - 6} ${spineEndX + 10},${spineY} ${spineEndX},${spineY + 6}" fill="var(--text)"/>
    <rect x="${headX}" y="${spineY - 22}" width="105" height="44" rx="6" fill="var(--surface-2)" stroke="var(--text)" stroke-width="1"/>
    <text x="${headX + 52}" y="${spineY - 4}" font-size="11" font-weight="500" text-anchor="middle">Cutting</text>
    <text x="${headX + 52}" y="${spineY + 10}" font-size="11" font-weight="500" text-anchor="middle">downtime</text>
    ${ribsSvg}
  </svg>${insight}`
}

function renderEventLog(stoppages, currentStoppage, editable = true) {
  const all = [...stoppages]
  if (currentStoppage && !stoppages.find(s => s.id === currentStoppage.id)) all.push(currentStoppage)
  if (!all.length) return `<div class="empty">No events yet.</div>`
  return `<div class="log-box">${[...all].reverse().map(e => {
    const ongoing = !e.ended_at
    const dur = ongoing ? (new Date() - new Date(e.started_at)) / 1000 : (e.duration_seconds || 0)
    const isEditing = editingStoppageId === e.id

    if (isEditing && !ongoing) {
      // Inline edit form
      const reasonOpts = state.reasons.map(r =>
        `<option value="${r.id}" ${r.name === e.reason_name ? 'selected' : ''}>${esc(r.name)} (${CATEGORIES[r.category].label})</option>`
      ).join('')
      return `<div style="padding: 10px 0; border-bottom: 0.5px solid var(--border); background: var(--surface-2); padding-left: 8px; padding-right: 8px; border-radius: 6px;">
        <div style="font-size: 12px; color: var(--text-2); margin-bottom: 8px;">Editing event from ${fmtTime(e.started_at)}</div>
        <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 8px;">
          <div>
            <label class="inline">Reason</label>
            <select data-edit-reason="${e.id}">${reasonOpts}</select>
          </div>
          <div>
            <label class="inline">Duration (seconds)</label>
            <input type="number" min="0" step="1" data-edit-duration="${e.id}" value="${Math.round(dur)}" />
          </div>
        </div>
        <div class="flex" style="gap: 6px; justify-content: flex-end;">
          <button data-cancel-edit="${e.id}" class="btn-ghost">Cancel</button>
          <button data-save-edit="${e.id}" class="btn-success" style="padding: 6px 14px;">Save</button>
        </div>
      </div>`
    }

    const actionBtns = (editable && !ongoing) ? `
      <button class="btn-ghost" data-edit-stoppage="${e.id}" title="Edit" style="padding: 2px 8px; font-size: 12px;">Edit</button>
      <button class="btn-ghost" data-delete-stoppage="${e.id}" title="Delete" style="padding: 2px 8px; font-size: 12px; color: var(--danger-text);">×</button>
    ` : ''
    const cols = (editable && !ongoing) ? '1fr auto auto auto auto auto' : '1fr auto auto auto'

    return `<div class="table-row" style="grid-template-columns:${cols};">
      <div>${esc(e.reason_name)}</div>
      <div class="muted tabular">${fmtTime(e.started_at)}</div>
      <div class="tabular" style="color:${ongoing ? 'var(--warning-text)' : 'var(--text-2)'}; font-weight:${ongoing ? 500 : 400};">
        ${ongoing ? 'ongoing' : fmtTime(e.ended_at)}
      </div>
      <div class="muted tabular" style="min-width:60px; text-align:right;">${fmtDuration(dur)}</div>
      ${actionBtns}
    </div>`
  }).join('')}</div>`
}

  return `<div class="card-title">All sessions</div>
    <div class="log-box" style="max-height:none;">
      ${state.sessions.map(s => {
        const sec = s.ended_at
          ? (new Date(s.ended_at) - new Date(s.started_at)) / 1000
          : (new Date() - new Date(s.started_at)) / 1000
        const unitsLabel = s.session_type === 'fusing' ? 'parts' : 'sizes'
        return `<div class="table-row" data-view-id="${s.id}"
          style="grid-template-columns:1fr auto auto; cursor:pointer; padding: 10px 0;">
          <div>
            <div style="font-weight:500;">${esc(s.name)}</div>

              ${s.session_type === 'fusing' ? 'Fusing' : 'Garments'} · ${esc(new Date(s.started_at).toLocaleString())}${s.operator ? ' · ' + esc(s.operator) : ''}${s.machine ? ' · ' + esc(s.machine) : ''}
            </div>

function renderDetail() {
  const s = state.sessions.find(x => x.id === state.viewSessionId)
  if (!s) return `<div class="empty">Session not found.</div>`
  const sec = s.ended_at
    ? (new Date(s.ended_at) - new Date(s.started_at)) / 1000
    : (new Date() - new Date(s.started_at)) / 1000
  const totalDown = state.stoppages.reduce((a, x) => a + (x.duration_seconds || 0), 0)
  const uptimePct = sec > 0 ? ((sec - totalDown) / sec) * 100 : 100
  const est = estimateCutTime(s, sec - totalDown)
  const cutSec = est.seconds
  const perLay = outputPerLay(s)
  const laysLost = cutSec > 0 ? totalDown / cutSec : 0
  const outputLost = laysLost * perLay
  const word = outputWord(s.session_type, true)
  const breakdown = {}
  state.stoppages.forEach(x => { breakdown[x.reason_name] = (breakdown[x.reason_name] || 0) + (x.duration_seconds || 0) })

  const cutTimeBasis = est.source === 'self'
    ? `based on this session's uptime`
    : est.source === 'history'
    ? `based on ${esc(est.fromName || 'last session')}'s actual speed`
    : est.source === 'theoretical'
    ? `based on theoretical input`
    : ''

  return `<button class="btn-ghost" id="btn-back" style="margin-bottom:10px;">← Back to history</button>
    <div class="status-row">
      <div>
        <div class="status-label">Session · ${esc(s.name)} · ${s.session_type === 'fusing' ? 'Fusing' : 'Garments'}${s.operator ? ' · ' + esc(s.operator) : ''}${s.machine ? ' · ' + esc(s.machine) : ''}</div>
        <div class="status-value">${s.ended_at ? 'Completed' : 'In progress'}</div>
      </div>
      <div style="text-align:right;">
        <div class="status-label">Started</div>
        <div class="status-value" style="font-size:15px;">${esc(new Date(s.started_at).toLocaleString())}</div>
      </div>
    </div>

    <div class="card-title">Lay information</div>
    <div class="grid grid-4" style="margin-bottom:1.25rem;">
      <div class="stat">
        <div class="stat-label">Marker length</div>
        <div class="stat-value">${s.marker_length_m}</div>
        <div class="stat-sub">metres</div>
      </div>
      <div class="stat">
        <div class="stat-label">${s.session_type === 'fusing' ? 'Parts' : 'Sizes'} in marker</div>
        <div class="stat-value">${s.units_in_marker}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Plies</div>
        <div class="stat-value">${s.plies}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Cut speed (entered)</div>
        <div class="stat-value">${s.cut_speed_m_per_min}</div>
        <div class="stat-sub">m/min</div>
      </div>
    </div>

    <div class="card-title">Session summary</div>
    <div class="grid grid-4" style="margin-bottom:1.25rem;">
      <div class="stat"><div class="stat-label">Total duration</div><div class="stat-value">${fmtDuration(sec)}</div></div>
      <div class="stat"><div class="stat-label">Downtime</div><div class="stat-value">${fmtDuration(totalDown)}</div></div>
      <div class="stat"><div class="stat-label">Uptime</div><div class="stat-value">${Math.round(uptimePct)}%</div></div>
      <div class="stat">
        <div class="stat-label">Lays lost</div>
        <div class="stat-value">${laysLost.toFixed(1)}</div>
        <div class="stat-sub">≈ ${Math.round(outputLost).toLocaleString()} ${word}</div>
        ${cutTimeBasis ? `<div class="stat-sub" style="margin-top: 4px; font-style: italic;">${cutTimeBasis}</div>` : ''}
      </div>
    </div>
    <div class="card-title">Breakdown by reason</div>
    ${renderBreakdown(breakdown, totalDown, cutSec, perLay, word)}
    ${renderCutSpeedComparison(s, sec - totalDown, false)}
    <div class="card-title" style="margin-top:1.5rem;">Pareto analysis</div>
    ${renderPareto(breakdown, totalDown)}
    <div class="card-title" style="margin-top:1.5rem;">Fishbone: 4M</div>
    ${renderFishbone(breakdown, totalDown)}
    <div class="card-title" style="margin-top:1.5rem;">Event log</div>
    ${renderEventLog(state.stoppages, null)}`
}

function renderInsights() {
  const data = state.insightsData
  const rangeLabels = { today: 'Today', week: 'Last 7 days', month: 'Last 30 days', all: 'All time' }
  const ranges = ['today', 'week', 'month', 'all']

  const tabs = ranges.map(r =>
    `<button class="tab ${state.insightsRange === r ? 'active' : ''}" data-range="${r}">${rangeLabels[r]}</button>`
  ).join('')

  if (!data || data.loading) {
    return `
      <div class="card-title">Insights</div>
      <div class="tabs" style="margin-bottom: 1rem;">${tabs}</div>
      <div class="empty">Loading…</div>
    `
  }

  const sessions = data.sessions
  const stoppages = data.stoppages

  if (sessions.length === 0) {
    return `
      <div class="card-title">Insights</div>
      <div class="tabs" style="margin-bottom: 1rem;">${tabs}</div>
      <div class="empty">No sessions in this range.</div>
    `
  }

  // ─── Aggregate metrics ────────────────────────────────────────────────────
  // Sum uptime and downtime across sessions.
  // For each session: downtime = sum(stoppages.duration_seconds for that session)
  //                   sessionDuration = ended_at - started_at (or now if open)
  //                   uptime = sessionDuration - downtime
  const stopsBySession = {}
  stoppages.forEach(s => {
    if (!stopsBySession[s.session_id]) stopsBySession[s.session_id] = []
    stopsBySession[s.session_id].push(s)
  })

  let totalUptimeSec = 0
  let totalDowntimeSec = 0
  let totalGarmentsLost = 0
  let totalPartsLost = 0
  let totalGarmentsCut = 0
  let totalPartsCut = 0
  let completedSessionCount = 0

  // Per-session rows for the detail table
  const sessionRows = []

  sessions.forEach(s => {
    const sessionEnd = s.ended_at ? new Date(s.ended_at) : new Date()
    const sessionSec = (sessionEnd - new Date(s.started_at)) / 1000
    const stops = stopsBySession[s.id] || []
    const downSec = stops.reduce((a, x) => a + (x.duration_seconds || 0), 0)
    const upSec = Math.max(0, sessionSec - downSec)

    totalUptimeSec += upSec
    totalDowntimeSec += downSec

    const perLay = (s.units_in_marker || 0) * (s.plies || 0)
    let unitsLostThis = 0
    let laysLostThis = 0
    if (upSec > 0) {
      laysLostThis = downSec / upSec
      unitsLostThis = laysLostThis * perLay
      if (s.session_type === 'fusing') totalPartsLost += unitsLostThis
      else totalGarmentsLost += unitsLostThis
    }
    let unitsCutThis = 0
    if (s.ended_at) {
      completedSessionCount++
      unitsCutThis = perLay
      if (s.session_type === 'fusing') totalPartsCut += perLay
      else totalGarmentsCut += perLay
    }

    sessionRows.push({
      id: s.id,
      name: s.name,
      type: s.session_type,
      ended: !!s.ended_at,
      started_at: s.started_at,
      marker_length_m: s.marker_length_m,
      plies: s.plies,
      uptime_sec: upSec,
      downtime_sec: downSec,
      units_cut: unitsCutThis,
      units_lost: unitsLostThis,
    })
  })

  // Newest first (most recent at top)
  sessionRows.sort((a, b) => new Date(b.started_at) - new Date(a.started_at))

  const overallUptimePct = (totalUptimeSec + totalDowntimeSec) > 0
    ? (totalUptimeSec / (totalUptimeSec + totalDowntimeSec)) * 100
    : 0

  // ─── Aggregated breakdown for Pareto + fishbone ───────────────────────────
  const breakdown = {}
  stoppages.forEach(s => {
    breakdown[s.reason_name] = (breakdown[s.reason_name] || 0) + (s.duration_seconds || 0)
  })

  // ─── Production loss tile combining garments and parts ────────────────────
  const lossLines = []
  if (totalGarmentsLost > 0) lossLines.push(`${Math.round(totalGarmentsLost).toLocaleString()} garments`)
  if (totalPartsLost > 0)    lossLines.push(`${Math.round(totalPartsLost).toLocaleString()} parts`)
  const lossDisplay = lossLines.length ? lossLines.join(' + ') : '—'

  const cutLines = []
  if (totalGarmentsCut > 0) cutLines.push(`${totalGarmentsCut.toLocaleString()} garments`)
  if (totalPartsCut > 0)    cutLines.push(`${totalPartsCut.toLocaleString()} parts`)
  const cutDisplay = cutLines.length ? cutLines.join(' + ') : '—'

  return `
    <div class="card-title">Insights · ${rangeLabels[state.insightsRange]}</div>
    <div class="tabs" style="margin-bottom: 1rem;">${tabs}</div>

    <div class="grid grid-4" style="margin-bottom: 1.25rem;">
      <div class="stat">
        <div class="stat-label">Total cutting time</div>
        <div class="stat-value">${fmtDuration(totalUptimeSec)}</div>
        <div class="stat-sub">across ${sessions.length} session${sessions.length === 1 ? '' : 's'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total downtime</div>
        <div class="stat-value">${fmtDuration(totalDowntimeSec)}</div>
        <div class="stat-sub">${stoppages.length} stoppage${stoppages.length === 1 ? '' : 's'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Overall uptime</div>
        <div class="stat-value">${Math.round(overallUptimePct)}%</div>
        <div class="stat-sub">${completedSessionCount} completed</div>
      </div>
      <div class="stat">
        <div class="stat-label">Capacity lost</div>
        <div class="stat-value" style="font-size: 16px; line-height: 1.3;">${lossDisplay}</div>
        <div class="stat-sub">vs ${cutDisplay} actually cut</div>
      </div>
    </div>

    <div class="card-title">Per-session detail</div>
    <div class="log-box" style="max-height:none; overflow-x: auto;">
      <div class="table-row" style="grid-template-columns: 1.5fr 0.7fr 0.5fr 0.7fr 0.7fr 0.6fr 0.9fr 0.9fr; font-weight: 500; font-size: 12px; color: var(--text-2); border-bottom: 0.5px solid var(--border-strong); position: sticky; top: 0; background: var(--surface);">
        <div>Session</div>
        <div style="text-align: right;">Marker</div>
        <div style="text-align: right;">Plies</div>
        <div style="text-align: right;">Uptime</div>
        <div style="text-align: right;">Downtime</div>
        <div style="text-align: right;">m/min</div>
        <div style="text-align: right;">Units cut</div>
        <div style="text-align: right;">Units lost</div>
      </div>
      ${sessionRows.map(r => {
        const word = outputWord(r.type, true)
        const cutDisp = r.units_cut > 0 ? `${r.units_cut.toLocaleString()} ${word}` : '<span class="muted">in progress</span>'
        const lostDisp = r.units_lost > 0 ? `${Math.round(r.units_lost).toLocaleString()} ${word}` : '—'
        const dateLabel = new Date(r.started_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const upMin = r.uptime_sec / 60
        const mPerMin = (upMin > 0.05 && r.marker_length_m > 0) ? r.marker_length_m / upMin : 0
        const mPerMinDisp = mPerMin > 0 ? mPerMin.toFixed(2) : '<span class="muted">—</span>'
        return `<div class="table-row" style="grid-template-columns: 1.5fr 0.7fr 0.5fr 0.7fr 0.7fr 0.6fr 0.9fr 0.9fr; font-size: 13px;">
          <div>
            <div style="font-weight: 500;">${esc(r.name)}</div>
            <div class="muted" style="font-size: 12px;">${dateLabel}${r.ended ? '' : ' · <span style="color:var(--warning-text);">open</span>'}</div>
          </div>
          <div class="tabular" style="text-align: right;">${r.marker_length_m}m</div>
          <div class="tabular" style="text-align: right;">${r.plies}</div>
          <div class="tabular" style="text-align: right;">${fmtDuration(r.uptime_sec)}</div>
          <div class="tabular" style="text-align: right; color: ${r.downtime_sec > 0 ? 'var(--text)' : 'var(--text-3)'};">${fmtDuration(r.downtime_sec)}</div>
          <div class="tabular" style="text-align: right;">${mPerMinDisp}</div>
          <div class="tabular" style="text-align: right;">${cutDisp}</div>
          <div class="tabular" style="text-align: right; color: ${r.units_lost > 0 ? 'var(--danger-text)' : 'var(--text-3)'};">${lostDisp}</div>
        </div>`
      }).join('')}
    </div>

function fRenderActive() {
  const s = state.fActiveSession
  const now = new Date()
  const sessionSec = (now - new Date(s.started_at)) / 1000

  const panels = state.fEvents.filter(e => e.event_type === 'panel')
  const completedPanels = panels.filter(e => e.ended_at)
  const stoppages = state.fEvents.filter(e => e.event_type === 'stoppage')
  const completedStoppages = stoppages.filter(e => e.ended_at)

  const panelTimeFinished = completedPanels.reduce((a, e) => a + (e.duration_seconds || 0), 0)
  const stoppageTimeFinished = completedStoppages.reduce((a, e) => a + (e.duration_seconds || 0), 0)
  const currentPanelDur = state.fCurrentPanel ? (now - new Date(state.fCurrentPanel.started_at)) / 1000 : 0
  const currentStoppageDur = state.fCurrentStoppage ? (now - new Date(state.fCurrentStoppage.started_at)) / 1000 : 0
  const totalStoppageTime = stoppageTimeFinished + currentStoppageDur
  const totalPanelTime = panelTimeFinished + currentPanelDur

  // ─── Untagged idle gap calculation ──────────────────────────────────────
  // Walk every event in the bundle (panels + stoppages) treating each as a
  // [start, end] interval. Sum the time NOT covered by any interval — that's
  // the operator's untagged idle time between actions.
  // Gaps shorter than IDLE_THRESHOLD are ignored (normal handling between panels).
  const IDLE_THRESHOLD_SEC = 5
  const allIntervals = state.fEvents.map(e => ({
    start: new Date(e.started_at),
    end: e.ended_at ? new Date(e.ended_at) : now,
  })).sort((a, b) => a.start - b.start)

  const sessionStart = new Date(s.started_at)
  let cursor = sessionStart
  let untaggedIdleSec = 0
  for (const iv of allIntervals) {
    if (iv.start > cursor) {
      const gapSec = (iv.start - cursor) / 1000
      if (gapSec >= IDLE_THRESHOLD_SEC) untaggedIdleSec += gapSec
    }
    if (iv.end > cursor) cursor = iv.end
  }
  // Trailing gap from last event's end to "now" (only counts if no event is open)
  if (!state.fCurrentPanel && !state.fCurrentStoppage && now > cursor) {
    const trailing = (now - cursor) / 1000
    if (trailing >= IDLE_THRESHOLD_SEC) untaggedIdleSec += trailing
  }

  // "Productive idle" is the press running with panel events happening at a healthy rate.
  // We don't separate that out — operators tap Panel for active loading and any
  // gap above threshold counts as untagged idle. Tune IDLE_THRESHOLD_SEC if needed.

  const totalDowntimeSec = totalStoppageTime + untaggedIdleSec
  const uptimeSec = Math.max(0, sessionSec - totalDowntimeSec)
  const uptimePct = sessionSec > 0 ? (uptimeSec / sessionSec) * 100 : 100
  const panelsCount = panels.length
  const avgCycleSec = completedPanels.length > 0 ? panelTimeFinished / completedPanels.length : 0

  let statusLabel, timerLabel, timerVal
  if (state.fCurrentStoppage) {
    statusLabel = 'Stopped'; timerLabel = 'Stopped for'; timerVal = fmtDuration(currentStoppageDur)
  } else if (state.fCurrentPanel) {
    statusLabel = 'Loading panel'; timerLabel = 'Panel cycle'; timerVal = fmtDuration(currentPanelDur)
  } else {
    statusLabel = 'Idle'; timerLabel = 'Since last action'
    const lastEnd = state.fEvents.filter(e => e.ended_at).map(e => new Date(e.ended_at)).sort((a, b) => b - a)[0] || new Date(s.started_at)
    timerVal = fmtDuration((now - lastEnd) / 1000)
  }

  const breakdown = {}
  completedStoppages.forEach(e => { breakdown[e.reason_name] = (breakdown[e.reason_name] || 0) + (e.duration_seconds || 0) })
  if (state.fCurrentStoppage) breakdown[state.fCurrentStoppage.reason_name] = (breakdown[state.fCurrentStoppage.reason_name] || 0) + currentStoppageDur

  // Inject untagged idle as a synthetic reason (rendered as Method)
  const IDLE_REASON_NAME = 'Idle (untagged)'
  if (untaggedIdleSec > 0) breakdown[IDLE_REASON_NAME] = untaggedIdleSec

  const fGetCategory = name => {
    if (name === IDLE_REASON_NAME) return 'method'
    const r = state.fReasons.find(x => x.name === name)
    return r ? r.category : 'method'
  }

  const realignCount = stoppages.filter(e => /realign/i.test(e.reason_name || '')).length
  const realignRate = panelsCount > 0 ? (realignCount / panelsCount) * 100 : 0
  const waitingTime = Object.entries(breakdown).filter(([name]) => /wait/i.test(name)).reduce((a, [, dur]) => a + dur, 0)

  return `
    <div class="status-row">
      <div>
        <div class="status-label">Bundle · ${esc(s.name)}${s.operator ? ' · ' + esc(s.operator) : ''}${s.machine ? ' · ' + esc(s.machine) : ''}</div>
        <div class="status-value">${statusLabel}</div>
      </div>
      <div style="text-align:right;">
        <div class="status-label">${timerLabel}</div>
        <div class="status-value">${timerVal}</div>
      </div>
    </div>
    ${state.fCurrentStoppage ? `<div class="banner">Currently stopped: ${esc(state.fCurrentStoppage.reason_name)}</div>` : ''}

    <div class="card-surface">
      <button id="f-panel-btn" class="btn-success" style="width:100%; padding: 18px; font-size: 17px; font-weight: 500;">
        ▶ Panel (tap when next panel is loaded)
      </button>
      <div class="muted" style="font-size: 12px; margin-top: 8px; text-align: center;">
        Each tap starts a new panel cycle and closes the previous one. Tap a stoppage button below to stop.
      </div>
    </div>

    <div class="card-surface">
      <div class="card-title">Stoppage reasons</div>
      <div class="reason-grid">
        ${state.fReasons.map(r => {
          const cat = CATEGORIES[r.category]
          return `<button class="reason-btn" data-f-reason-id="${r.id}">
            <span class="name">${esc(r.name)}</span>
            <span class="cat" style="color:${cat.color};">${cat.label}</span>
          </button>`
        }).join('')}
      </div>
      ${state.fCurrentStoppage ? `<button class="btn-success" style="width:100%; margin-top:10px; padding:10px;" id="f-resume-btn">▶ Resume</button>` : ''}
    </div>

    <div class="card-title">Bundle summary</div>
    <div class="grid grid-4" style="margin-bottom:1.25rem;">
      <div class="stat">
        <div class="stat-label">Bundle elapsed</div>
        <div class="stat-value">${fmtDuration(sessionSec)}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Panels fused</div>
        <div class="stat-value">${completedPanels.length}${state.fCurrentPanel ? ` <span style="font-size: 14px; color: var(--text-2);">+ 1 in progress</span>` : ''}</div>
        ${s.panel_count_planned ? `<div class="stat-sub">of ${s.panel_count_planned} planned</div>` : ''}
      </div>
      <div class="stat">
        <div class="stat-label">Total downtime</div>
        <div class="stat-value">${fmtDuration(totalDowntimeSec)}</div>
        <div class="stat-sub">${Math.round(uptimePct)}% uptime · ${fmtDuration(untaggedIdleSec)} untagged</div>
      </div>
      <div class="stat">
        <div class="stat-label">Avg cycle time</div>
        <div class="stat-value">${avgCycleSec > 0 ? avgCycleSec.toFixed(1) + 's' : '—'}</div>
        <div class="stat-sub">per panel loaded</div>
      </div>
    </div>

    ${(realignCount > 0 || waitingTime > 0) ? `
      <div class="grid grid-2" style="margin-bottom: 1.25rem;">
        <div class="stat">
          <div class="stat-label">Realigning rate</div>
          <div class="stat-value">${realignRate.toFixed(1)}%</div>
          <div class="stat-sub">${realignCount} realigns / ${panelsCount} panels</div>
        </div>
        <div class="stat">
          <div class="stat-label">Idle belt time</div>
          <div class="stat-value">${fmtDuration(waitingTime)}</div>
          <div class="stat-sub">press running with no work</div>
        </div>
      </div>
    ` : ''}

    <div class="card-title">Pareto analysis</div>
    ${renderParetoFusing(breakdown, totalDowntimeSec, fGetCategory)}

    <div class="card-title" style="margin-top:1.5rem;">Fishbone: 4M</div>
    ${renderFishboneFusing(breakdown, totalDowntimeSec, fGetCategory)}

    <div class="flex between" style="margin:1.5rem 0 10px;">
      <div class="card-title" style="margin:0;">Event log</div>
      <button class="btn-danger" id="f-end-session-btn">End bundle</button>
    </div>
    ${fRenderEventLog()}
  `
}

function fRenderEventLog() {
  if (!state.fEvents.length) return `<div class="empty">No events yet. Tap Panel when you load the first one.</div>`
  let panelNum = 0
  const numbered = state.fEvents.map(e => {
    if (e.event_type === 'panel') { panelNum++; return { ...e, _num: panelNum } }
    return e
  })
  return `<div class="log-box">${numbered.slice().reverse().map(e => {
    const ongoing = !e.ended_at
    const dur = ongoing ? (new Date() - new Date(e.started_at)) / 1000 : (e.duration_seconds || 0)
    const isPanel = e.event_type === 'panel'
    const icon = isPanel ? '▢' : '⏸'
    const label = isPanel ? `Panel #${e._num}` : esc(e.reason_name)
    const color = isPanel ? 'var(--success-text)' : (ongoing ? 'var(--warning-text)' : 'var(--text)')
    const isEditing = fEditingEventId === e.id

    if (isEditing && !ongoing) {
      // Inline edit form. Stoppages can change reason + duration; panels only duration.
      let reasonField = ''
      if (!isPanel) {
        const reasonOpts = state.fReasons.map(r =>
          `<option value="${r.id}" ${r.name === e.reason_name ? 'selected' : ''}>${esc(r.name)} (${CATEGORIES[r.category].label})</option>`
        ).join('')
        reasonField = `<div>
            <label class="inline">Reason</label>
            <select data-f-edit-event-reason="${e.id}">${reasonOpts}</select>
          </div>`
      }
      return `<div style="padding: 10px 0; border-bottom: 0.5px solid var(--border); background: var(--surface-2); padding-left: 8px; padding-right: 8px; border-radius: 6px;">
        <div style="font-size: 12px; color: var(--text-2); margin-bottom: 8px;">Editing ${isPanel ? 'panel cycle' : 'stoppage'} from ${fmtTime(e.started_at)}</div>
        <div class="grid" style="grid-template-columns: ${isPanel ? '1fr' : '2fr 1fr'}; gap: 8px; margin-bottom: 8px;">
          ${reasonField}
          <div>
            <label class="inline">Duration (seconds)</label>

          <button data-f-save-event-edit="${e.id}" class="btn-success" style="padding: 6px 14px;">Save</button>
        </div>
      </div>`
    }

    const actionBtns = ongoing ? '' : `
      <button class="btn-ghost" data-f-edit-event="${e.id}" style="padding: 2px 8px; font-size: 12px;">Edit</button>
      <button class="btn-ghost" data-f-delete-event="${e.id}" style="padding: 2px 8px; font-size: 12px; color: var(--danger-text);">×</button>
    `
    const cols = ongoing ? 'auto 1fr auto auto auto' : 'auto 1fr auto auto auto auto auto'

    return `<div class="table-row" style="grid-template-columns: ${cols};">
      <div style="color: ${color}; font-weight: 500;">${icon}</div>
      <div>${label}</div>
      <div class="muted tabular">${fmtTime(e.started_at)}</div>
      <div class="tabular" style="color:${ongoing ? 'var(--warning-text)' : 'var(--text-2)'}; font-weight:${ongoing ? 500 : 400};">
        ${ongoing ? 'ongoing' : fmtTime(e.ended_at)}
      </div>
      <div class="muted tabular" style="min-width:60px; text-align:right;">${fmtDuration(dur)}</div>
      ${actionBtns}
    </div>`
  }).join('')}</div>`
}
